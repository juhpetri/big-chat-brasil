<div class="login-page">
  <div class="login-card">
    <div class="brand">
      <span class="display brand-name">BCB</span>
      <span class="brand-sub">Big Chat Brasil</span>
    </div>

    <h1 class="display login-title">Identifique-se</h1>
    <p class="login-lede">Informe seu CPF ou CNPJ pra entrar.</p>

    <form (ngSubmit)="submit()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>CPF ou CNPJ</mat-label>
        <input
          matInput
          name="document"
          autocomplete="off"
          [ngModel]="document()"
          (ngModelChange)="document.set($event)"
          [disabled]="state() === 'loading'"
        />
        @if (documentType()) {
          <mat-hint>{{ documentType() }} detectado</mat-hint>
        }
      </mat-form-field>

      @if (state() === 'error') {
        <p class="error-message">{{ errorMessage() }}</p>
      }

      <button
        mat-flat-button
        color="primary"
        class="submit-btn"
        type="submit"
        [disabled]="state() === 'loading' || document().length === 0"
      >
        @if (state() === 'loading') {
          <mat-spinner diameter="20" />
        } @else {
          Entrar
        }
      </button>
    </form>
  </div>
</div>
