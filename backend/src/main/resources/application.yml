server:
  port: 8080
  # Sem isso, o Spring ignora os headers X-Forwarded-* que o proxy de portas do Codespaces (ou
  # qualquer reverse proxy) envia — daí o springdoc detecta a URL do servidor como
  # http://localhost:8080 (o host interno do container) em vez da URL pública, e o "Try it out"
  # do Swagger UI tenta bater num endereço que não existe do lado de fora.
  forward-headers-strategy: framework

spring:
  application:
    name: big-chat-brasil-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bcb}
    username: ${SPRING_DATASOURCE_USERNAME:bcb}
    password: ${SPRING_DATASOURCE_PASSWORD:bcb}

  jpa:
    hibernate:
      # O schema é criado/versionado pelo Liquibase (db/changelog) — Hibernate só confere que as
      # entidades batem com o que já existe no banco, nunca altera nada sozinho.
      ddl-auto: validate

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

logging:
  level:
    org.hibernate.SQL: DEBUG