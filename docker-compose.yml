services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: bcb
      POSTGRES_USER: bcb
      POSTGRES_PASSWORD: bcb
    volumes:
      - bcb_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bcb"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bcb
      SPRING_DATASOURCE_USERNAME: bcb
      SPRING_DATASOURCE_PASSWORD: bcb
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    environment:
      BACKEND_URL: http://backend:8080
    depends_on:
      - backend
    ports:
      - "4200:4000"

volumes:
  bcb_postgres_data:
